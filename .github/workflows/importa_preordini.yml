name: Importa Preordini (Wix)

on:
  workflow_dispatch:
    inputs:
      csv_path:
        description: "Percorso CSV (da XLS v7 esportato, delimitatore ';')"
        required: true
        default: "input/template_preordini_v7.csv"
      deposit_percent:
        description: "Percentuale acconto (es. 0.30 = 30%)"
        required: false
        default: "0.30"
      rate_installments:
        description: "Numero rate per PAGAMENTO RATEALE"
        required: false
        default: "3"
      rate_surcharge_percent:
        description: "Sovrapprezzo rateale (0.0 = nessuno)"
        required: false
        default: "0.0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui importazione
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          CSV_PATH: ${{ inputs.csv_path }}
          CURRENCY: "EUR"
          DEPOSIT_PERCENT: ${{ inputs.deposit_percent }}
          RATE_INSTALLMENTS: ${{ inputs.rate_installments }}
          RATE_SURCHARGE_PERCENT: ${{ inputs.rate_surcharge_percent }}
        run: |
          set -e
          echo "[INFO] CSV: ${CSV_PATH}"
          python wix_preorder_ingestion.py
